name: c_ipasir build test

on:
  push:
    paths:
      - 'c_ipasir.tar.gz'
      - 'c_ipasir/**'
      - '.github/workflows/c_ipasir.yml'
  pull_request:
    paths:
      - 'c_ipasir.tar.gz'
      - 'c_ipasir/**'
      - '.github/workflows/c_ipasir.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract tarball
        run: tar xzf c_ipasir.tar.gz

      - name: Build solver
        run: ./c_ipasir/build.sh

      - name: Smoke test
        run: |
          echo "solver binary:"
          file c_ipasir/solver
          ./c_ipasir/solver --help || true

      - name: Upload solver binary
        uses: actions/upload-artifact@v4
        with:
          name: solver-${{ matrix.name }}
          path: c_ipasir/solver
